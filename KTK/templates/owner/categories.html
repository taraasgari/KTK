{% extends 'owner/base.html' %}
{% block owner_content %}<div class="owner-header"><div><span class="section-kicker">CATEGORIES</span><h1>دسته‌بندی‌ها</h1></div><a class="btn btn-primary" href="{% url 'owner:category_new' %}">+ دسته‌بندی جدید</a></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>عنوان</th><th>نامک</th><th>وضعیت</th><th></th></tr></thead><tbody>{% for c in categories %}<tr><td><strong>{{ c.name }}</strong></td><td>{{ c.slug }}</td><td>{% if c.is_active %}فعال{% else %}غیرفعال{% endif %}</td><td><a href="{% url 'owner:category_edit' c.pk %}">ویرایش ←</a></td></tr>{% empty %}<tr><td colspan="4">دسته‌بندی وجود ندارد.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
